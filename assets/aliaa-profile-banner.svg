      <text x="64" y="155" font-family="Consolas,Monaco,monospace" font-size="14" fill="#FFC3D8">creative: true,</text>
      <text x="64" y="182" font-family="Consolas,Monaco,monospace" font-size="14" fill="#C7E9CA">alwaysLearning: true</text>
